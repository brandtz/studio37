<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio 37 Custom Designs</title>
<link rel="stylesheet" href="assets/css/studio37.css">
<link rel="stylesheet" href="https://unpkg.com/lucide-static@latest/font/lucide.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
/* Page-level overrides and animation */
@keyframes heroFadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.15); }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-8px); }
  40%     { transform: translateX(8px); }
  60%     { transform: translateX(-5px); }
  80%     { transform: translateX(5px); }
}
@keyframes slideInRight {
  from { transform: translateX(100%); opacity: 0; }
  to   { transform: translateX(0); opacity: 1; }
}
@keyframes chevronBounce {
  0%,100% { transform: translateY(0); }
  50%     { transform: translateY(6px); }
}

html { scroll-behavior: smooth; }
#root { min-height: 100vh; }

/* Grain overlay on body */
body::after {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 9999;
  opacity: 0.028;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 160px;
}

/* Photo placeholders (warm dark with subtle label) */
.photo-placeholder {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #2e2925 0%, #231f1b 100%);
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Sans', sans-serif; font-size: 12px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(158,146,135,0.4);
}

/* scroll-reveal */
.reveal {
  opacity: 0; transform: translateY(28px);
  transition: opacity 500ms ease, transform 500ms ease;
}
.reveal.visible { opacity: 1; transform: translateY(0); }

/* Services strip */
.services-strip {
  background: var(--color-surface-mid);
  border-top: 1px solid var(--color-divider);
  border-bottom: 1px solid var(--color-divider);
}
.service-card {
  padding: var(--space-7) var(--space-5);
  border-right: 1px solid var(--color-divider);
  cursor: pointer;
  transition: background var(--ease-base);
  flex: 1;
  position: relative;
}
.service-card:last-child { border-right: none; }
.service-card:hover { background: var(--color-surface-light); }
.service-card:hover .service-icon { color: var(--color-accent); }
.service-card:hover::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: var(--color-accent);
}
.service-icon {
  width: 28px; height: 28px; margin-bottom: var(--space-3);
  color: var(--color-text-dim);
  transition: color var(--ease-base);
}
.service-name {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.25rem; font-weight: 400;
  color: var(--color-text-primary);
  margin-bottom: 6px;
}
.service-desc {
  font-size: 0.8125rem; color: var(--color-text-muted);
  line-height: 1.5;
}

/* Featured work grid */
.work-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 340px 240px;
  gap: 3px;
}
.work-cell {
  position: relative; overflow: hidden; cursor: pointer;
}
.work-cell:first-child {
  grid-row: 1 / 3;
}
.work-cell-overlay {
  position: absolute; inset: 0;
  background: rgba(26,23,20,0);
  display: flex; align-items: flex-end;
  padding: var(--space-4);
  transition: background var(--ease-base);
}
.work-cell:hover .work-cell-overlay { background: rgba(26,23,20,0.65); }
.work-cell-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem; font-style: italic;
  color: var(--color-accent);
  opacity: 0; transform: translateY(8px);
  transition: all var(--ease-base);
}
.work-cell:hover .work-cell-label { opacity: 1; transform: translateY(0); }

/* Product grid */
.product-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-5);
}

/* About two-col */
.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-8);
  align-items: center;
}

/* CTA banner */
.cta-banner {
  background: var(--color-surface-mid);
  border-top: 1px solid var(--color-divider);
  border-bottom: 1px solid var(--color-divider);
  text-align: center;
  padding: var(--space-10) var(--space-8);
  position: relative;
  overflow: hidden;
}
.cta-banner::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(200,134,74,0.07) 0%, transparent 70%);
}

/* Portfolio masonry */
.masonry-grid {
  columns: 3;
  column-gap: var(--space-3);
}
.masonry-item {
  break-inside: avoid;
  margin-bottom: var(--space-3);
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.masonry-item img, .masonry-item .photo-placeholder {
  width: 100%;
  transition: transform 250ms ease;
  border-radius: var(--radius-sm);
}
.masonry-item:hover img { transform: scale(1.03); }

/* Quote form */
.quote-form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
}

/* Admin table */
.admin-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}
.admin-table th {
  text-align: left;
  padding: 10px 14px;
  font-size: 0.6875rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(158,146,135,0.7);
  border-bottom: 1px solid var(--color-admin-border);
  font-weight: 500;
}
.admin-table td {
  padding: 14px;
  border-bottom: 1px solid rgba(46,109,164,0.1);
  color: #c8c0b8;
  vertical-align: middle;
}
.admin-table tr:hover td {
  background: rgba(200,134,74,0.04);
}

/* Admin product thumb */
.admin-thumb {
  width: 56px; height: 56px;
  border-radius: 4px;
  overflow: hidden;
  background: var(--color-surface-mid);
}
.admin-thumb img { width: 100%; height: 100%; object-fit: cover; }

/* Status dot */
.status-dot {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.8125rem;
}
.status-dot::before {
  content: '';
  display: block; width: 7px; height: 7px; border-radius: 50%;
}
.status-dot.available::before { background: #4a9a6a; }
.status-dot.out-of-stock::before { background: #7a6f65; box-shadow: none; border: 1px solid #7a6f65; }
.status-dot.by-request::before { background: #c8864a; }
.status-dot.archived::before { background: #c0392b; }

/* Lightbox */
.lightbox-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(10,8,6,0.93);
  display: flex; align-items: center; justify-content: center;
}
.lightbox-inner { max-width: 900px; width: 90%; position: relative; }
.lightbox-inner img { width: 100%; max-height: 80vh; object-fit: contain; }

/* Mobile nav overlay */
.mobile-nav-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(26,23,20,0.98);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: var(--space-7);
}
.mobile-nav-link {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.5rem; font-weight: 300;
  letter-spacing: 0.06em;
  color: var(--color-text-primary);
  text-transform: uppercase;
  transition: color var(--ease-fast);
}
.mobile-nav-link:hover { color: var(--color-accent); }

/* Admin modal drawer */
.admin-drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 480px; max-width: 100%;
  background: var(--color-admin-card);
  border-left: 1px solid var(--color-admin-border);
  z-index: 500;
  display: flex; flex-direction: column;
  animation: slideInRight 280ms ease;
  box-shadow: -8px 0 32px rgba(0,0,0,0.4);
}
.admin-drawer-header {
  padding: var(--space-5) var(--space-6);
  border-bottom: 1px solid var(--color-admin-border);
  display: flex; align-items: center; justify-content: space-between;
}
.admin-drawer-body {
  flex: 1; overflow-y: auto;
  padding: var(--space-6);
  display: flex; flex-direction: column; gap: var(--space-5);
}
.admin-drawer-footer {
  padding: var(--space-5) var(--space-6);
  border-top: 1px solid var(--color-admin-border);
  display: flex; gap: var(--space-3); justify-content: flex-end;
}

/* Admin input style */
.admin-input,
.admin-select,
.admin-textarea {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--color-admin-border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  color: #d0c8c0;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem;
  width: 100%;
  outline: none;
  transition: border-color 150ms ease;
}
.admin-input:focus,
.admin-select:focus,
.admin-textarea:focus {
  border-color: var(--color-accent);
  box-shadow: 0 0 0 2px rgba(200,134,74,0.15);
}
.admin-textarea { resize: vertical; min-height: 100px; }
.admin-label {
  font-size: 0.6875rem; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(158,146,135,0.8);
  margin-bottom: 6px;
  display: block;
}
.admin-field { display: flex; flex-direction: column; }

/* Scroll indicator */
.scroll-indicator {
  position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  z-index: 3;
}
.scroll-line {
  width: 1px; height: 48px;
  background: linear-gradient(to bottom, transparent, var(--color-accent));
  animation: chevronBounce 2s ease-in-out infinite;
}

/* Services alternating layout */
.service-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  align-items: stretch;
  border-bottom: 1px solid var(--color-divider);
}
.service-section.reverse { direction: rtl; }
.service-section.reverse > * { direction: ltr; }
.service-photo {
  aspect-ratio: 4/3;
  position: relative;
  overflow: hidden;
}
.service-photo img { width: 100%; height: 100%; object-fit: cover; }
.service-text {
  padding: var(--space-9) var(--space-8);
  display: flex; flex-direction: column; justify-content: center;
  background: var(--color-surface-mid);
}
.service-text h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.25rem; font-weight: 400;
  letter-spacing: 0.03em;
  color: var(--color-text-primary);
  margin-bottom: var(--space-4);
}
.service-text p {
  font-size: 0.9375rem;
  color: var(--color-text-muted);
  line-height: 1.7;
  margin-bottom: var(--space-4);
}
.service-meta {
  display: flex; gap: var(--space-5);
  margin: var(--space-4) 0;
}
.service-meta-item {
  font-size: 0.8125rem;
  color: var(--color-text-dim);
}
.service-meta-item strong { color: var(--color-accent); display: block; font-size: 1rem; }
.service-checklist {
  list-style: none;
  margin: var(--space-3) 0 var(--space-5);
}
.service-checklist li {
  font-size: 0.875rem;
  color: var(--color-text-muted);
  padding: 5px 0 5px 20px;
  position: relative;
}
.service-checklist li::before {
  content: '–';
  position: absolute; left: 0;
  color: var(--color-accent);
}

/* Pull quote */
.pull-quote {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.75rem;
  font-style: italic;
  font-weight: 300;
  color: var(--color-text-primary);
  line-height: 1.4;
  padding-left: var(--space-5);
  border-left: 2px solid var(--color-accent);
  margin: var(--space-7) 0;
  max-width: 640px;
}

/* About craft cards */
.craft-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-5);
  margin-top: var(--space-7);
}
.craft-card {
  padding: var(--space-6);
  background: var(--color-surface-mid);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
}
.craft-card h4 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.25rem; font-weight: 400;
  color: var(--color-text-primary);
  margin-bottom: var(--space-2);
}
.craft-card p { font-size: 0.875rem; color: var(--color-text-muted); line-height: 1.6; }

/* Footer grid */
.footer-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr;
  gap: var(--space-8);
  max-width: var(--max-width);
  margin: 0 auto;
  padding-bottom: var(--space-7);
}
.footer-links {
  list-style: none;
  display: flex; flex-direction: column; gap: var(--space-3);
}
.footer-links a {
  font-size: 0.875rem; color: var(--color-text-dim);
  transition: color var(--ease-fast);
}
.footer-links a:hover { color: var(--color-text-muted); }
.footer-bottom {
  border-top: 1px solid var(--color-divider);
  padding-top: var(--space-4);
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: var(--max-width);
  margin: 0 auto;
}
.footer-bottom p { font-size: 0.8125rem; color: var(--color-text-dim); }

/* Hamburger */
.hamburger {
  display: none;
  flex-direction: column; gap: 5px;
  cursor: pointer; padding: 6px;
}
.hamburger span {
  display: block; width: 24px; height: 1.5px;
  background: var(--color-text-muted);
  transition: all var(--ease-base);
}
@media (max-width: 768px) {
  .hamburger { display: flex; }
  .product-grid { grid-template-columns: 1fr 1fr; }
  .about-grid { grid-template-columns: 1fr; }
  .service-section { grid-template-columns: 1fr; }
  .work-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
  .work-cell:first-child { grid-row: auto; }
  .masonry-grid { columns: 2; }
  .craft-grid { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr; gap: var(--space-6); }
  .quote-form-grid { grid-template-columns: 1fr; }
  .admin-table td:nth-child(3),
  .admin-table th:nth-child(3) { display: none; }
}
@media (max-width: 480px) {
  .product-grid { grid-template-columns: 1fr; }
  .masonry-grid { columns: 1; }
}

/* Page wrapper — for SPA routing */
.page { display: none; }
.page.active { display: block; }

/* Admin login shake */
.shake { animation: shake 400ms ease; }

/* Upload zone */
.upload-zone {
  border: 2px dashed var(--color-admin-border);
  border-radius: var(--radius-md);
  padding: var(--space-7) var(--space-5);
  text-align: center;
  cursor: pointer;
  transition: border-color var(--ease-base);
}
.upload-zone:hover { border-color: var(--color-accent); }

/* Radio pill toggles */
.radio-group { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.radio-pill {
  padding: 8px 18px;
  border-radius: var(--radius-pill);
  border: 1.5px solid var(--color-border);
  font-size: 0.875rem; font-weight: 500;
  color: var(--color-text-muted);
  cursor: pointer; transition: all var(--ease-base);
  background: transparent;
}
.radio-pill.selected {
  border-color: var(--color-accent);
  color: var(--color-accent);
  background: var(--color-accent-muted);
}

/* Status radio for admin */
.status-radio-group { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.status-radio {
  padding: 7px 16px;
  border-radius: var(--radius-pill);
  font-size: 0.8125rem; font-weight: 500;
  border: 1.5px solid var(--color-admin-border);
  color: rgba(158,146,135,0.8);
  cursor: pointer; transition: all var(--ease-base);
  background: transparent;
}
.status-radio.sel-available { border-color: #4a9a6a; color: #4a9a6a; background: rgba(74,154,106,0.1); }
.status-radio.sel-out_of_stock { border-color: #7a6f65; color: #7a6f65; background: rgba(122,111,101,0.1); }
.status-radio.sel-by_request { border-color: #c8864a; color: #c8864a; background: rgba(200,134,74,0.1); }
.status-radio.sel-archived { border-color: #c0392b; color: #c0392b; background: rgba(192,57,43,0.1); }

/* Notification toast */
.toast {
  position: fixed; bottom: 32px; right: 32px; z-index: 2000;
  background: var(--color-surface-light);
  border: 1px solid var(--color-accent);
  border-radius: var(--radius-md);
  padding: 14px 22px;
  font-size: 0.875rem;
  color: var(--color-text-primary);
  box-shadow: var(--shadow-modal);
  animation: slideInRight 200ms ease;
}
</style>
</head>
<body>
<div id="root"></div>

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

  const handleLogin = (e) => {
    e.preventDefault();
    if (password === 'studio37') { setAuthed(true); }

  const filtered = products.filter(p => {

// ─── TWEAKS PANEL ────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#c8864a",
  "surfaceDark": "#1a1714",
  "fontDisplay": "Cormorant Garamond",
  "grainIntensity": 3,
  "cardRadius": 8,
  "spacingDensity": "airy"
}/*EDITMODE-END*/;

// ─── APP ROOT ────────────────────────────────────────────────────────────────
const App = () => {
  const [page, setPage] = useState('home');
  const [cartCount, setCartCount] = useState(0);

  const navigate = (p) => {
    setPage(p);
    window.scrollTo(0, 0);
  };

  // Tweaks
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => {
    document.documentElement.style.setProperty('--color-accent', tweaks.accentColor);
    document.documentElement.style.setProperty('--color-accent-light', tweaks.accentColor + 'cc');
    document.documentElement.style.setProperty('--color-surface-dark', tweaks.surfaceDark);
    document.documentElement.style.setProperty('--radius-md', tweaks.cardRadius + 'px');
    if (tweaks.spacingDensity === 'compact') {
      document.documentElement.style.setProperty('--space-9', '64px');
      document.documentElement.style.setProperty('--space-8', '48px');
    } else {
      document.documentElement.style.setProperty('--space-9', '96px');
      document.documentElement.style.setProperty('--space-8', '64px');
    }
    document.body.style.setProperty('--grain-opacity', (tweaks.grainIntensity / 100).toString());
  }, [tweaks]);

  const pages = { home: HomePage, services: ServicesPage, portfolio: PortfolioPage, shop: ShopPage, about: AboutPage, contact: ContactPage, admin: AdminPage };
  const PageComponent = pages[page] || HomePage;

  return (
    <>
      {page !== 'admin' && <Nav currentPage={page} navigate={navigate} cartCount={cartCount} />}
      <PageComponent navigate={navigate} cartCount={cartCount} setCartCount={setCartCount} />

      <TweaksPanel title="Studio 37 Tweaks">
        <TweakSection title="Colors">
          <TweakColor id="accentColor" label="Accent Color" />
          <TweakColor id="surfaceDark" label="Background Dark" />
        </TweakSection>
        <TweakSection title="Typography">
          <TweakRadio id="fontDisplay" label="Display Font"
            options={['Cormorant Garamond', 'Playfair Display', 'EB Garamond']} />
        </TweakSection>
        <TweakSection title="Texture & Spacing">
          <TweakSlider id="grainIntensity" label="Grain Intensity" min={0} max={8} step={1} />
          <TweakSlider id="cardRadius" label="Card Radius (px)" min={0} max={20} step={2} />
          <TweakRadio id="spacingDensity" label="Section Spacing"
            options={['airy', 'compact']} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
