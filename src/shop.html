<!doctype html>
<html lang="en" data-page="shop">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop &mdash; Studio 37 Custom Designs</title>
  <meta name="description" content="Handcrafted small goods, cutting boards, charcuterie, and gift pieces, ready to ship." />
  <link rel="icon" href="/assets/images/logo.png" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/site.css" />
  <script defer src="/assets/js/site.js"></script>
  <script defer src="/assets/js/shop.js"></script>

  <!-- Snipcart (Square configured as the payment gateway in the Snipcart dashboard) -->
  <script>
    window.SnipcartSettings = {
      publicApiKey: '__SNIPCART_PUBLIC_KEY__',
      loadStrategy: 'on-user-interaction',
      currency: 'usd'
    };
  </script>
  <script async src="https://cdn.snipcart.com/themes/v3.7.1/default/snipcart.js"></script>
  <link rel="preconnect" href="https://cdn.snipcart.com" />
  <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.7.1/default/snipcart.css" />
  <style>
    /* Snipcart palette overrides — match site palette */
    :root {
      --color-default: #f0ebe3;
      --color-alt: #9e9287;
      --color-input-default: #f0ebe3;
      --color-buttonPrimary: #c8864a;
      --color-buttonPrimary-hover: #dfa06a;
      --color-buttonPrimary-active: #a8683a;
      --color-link: #c8864a;
      --borderRadius-md: 4px;
    }
  </style>
</head>
<body class="grain">
  <header class="nav"></header>
  <nav class="nav-mobile-overlay" aria-label="Mobile navigation"></nav>

  <section class="hero hero-short">
    <div class="hero-bg"><img src="/assets/images/portfolio_1.jpg" alt="" /></div>
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <p class="hero-eyebrow">Studio 37</p>
      <h1 class="hero-title">The Shop</h1>
      <p class="hero-sub">Handcrafted goods, ready to ship.</p>
    </div>
  </section>

  <div class="shop-filters">
    <div class="filter-bar">
      <button class="filter-pill active" data-filter="all">All</button>
      <button class="filter-pill" data-filter="cutting-boards">Cutting Boards</button>
      <button class="filter-pill" data-filter="charcuterie">Charcuterie</button>
      <button class="filter-pill" data-filter="furniture">Furniture</button>
      <button class="filter-pill" data-filter="custom">Custom Pieces</button>
    </div>
  </div>

  <section class="product-grid" id="product-grid" aria-live="polite">
    <!-- Skeletons rendered by shop.js until /api/products responds -->
  </section>

  <section class="cta-banner">
    <h2>Looking for Something Custom?</h2>
    <p>Tell me what you have in mind. Most pieces are made to order.</p>
    <a class="btn-primary" href="/contact">Request a Custom Piece</a>
  </section>

  <footer class="footer"></footer>
</body>
</html>
