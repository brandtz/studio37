<!doctype html>
<html lang="en" data-page="shop">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a1714" />
<title>Shop &mdash; Studio 37 Custom Designs</title>
  <meta name="description" content="Handcrafted small goods, cutting boards, charcuterie, and gift pieces, ready to ship." />
  <link rel="canonical" href="https://studio37customdesigns.com/shop" />
  <meta property="og:title" content="Shop — Studio 37 Custom Designs" />
  <meta property="og:description" content="Handcrafted small goods, cutting boards, charcuterie boards, and gift pieces, ready to ship." />
  <meta property="og:image" content="/assets/images/og-image.jpg" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://studio37customdesigns.com/shop" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/icon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/icon-180.png" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/site.css" />
  <script defer src="/assets/js/site.js"></script>
  <script defer src="/assets/js/cart.js"></script>
  <script defer src="/assets/js/shop.js"></script>
</head>
<body class="grain">
  <header class="nav"></header>
  <nav class="nav-mobile-overlay" aria-label="Mobile navigation"></nav>

  <section class="hero hero-short">
    <div class="hero-bg"><img src="/assets/images/portfolio_1.jpg" alt="" /></div>
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <p class="hero-eyebrow">Studio 37</p>
      <h1 class="hero-title">The Shop</h1>
      <p class="hero-sub">Handcrafted goods, ready to ship.</p>
    </div>
  </section>

  <div class="shop-filters">
    <div class="filter-bar">
      <button class="filter-pill active" data-filter="all">All</button>
      <button class="filter-pill" data-filter="cutting-boards">Cutting Boards</button>
      <button class="filter-pill" data-filter="charcuterie">Charcuterie</button>
      <button class="filter-pill" data-filter="furniture">Furniture</button>
      <button class="filter-pill" data-filter="saunas">Saunas</button>
      <button class="filter-pill" data-filter="custom">Custom Pieces</button>
    </div>
  </div>

  <section class="product-grid" id="product-grid" aria-live="polite">
    <!-- Skeletons rendered by shop.js until /api/products responds -->
  </section>

  <section class="cta-banner">
    <h2>Looking for Something Custom?</h2>
    <p>Tell me what you have in mind. Most pieces are made to order.</p>
    <a class="btn-primary" href="/contact">Request a Custom Piece</a>
  </section>

  <footer class="footer"></footer>
</body>
</html>
