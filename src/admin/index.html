<!doctype html>
<html lang="en" data-page="admin">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Studio 37 Admin</title>
  <link rel="icon" href="/assets/images/logo-mark.png" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
  <script defer src="/assets/js/admin-login.js"></script>
</head>
<body class="admin grain">

  <!-- Login view -->
  <section class="admin-login" id="view-login">
    <!-- Sign-in panel -->
    <form class="admin-login-card" id="login-form" data-panel="signin">
      <img src="/assets/images/logo.png" alt="Studio 37" />
      <h1>Studio 37 Admin</h1>
      <div class="form-field">
        <label class="form-label" for="loginEmail">Email</label>
        <input class="form-input" id="loginEmail" type="email" autocomplete="username" required />
      </div>
      <div class="form-field">
        <label class="form-label" for="loginPassword">Password</label>
        <input class="form-input" id="loginPassword" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn-primary" style="width:100%;margin-top:var(--space-4);justify-content:center;" type="submit">
        Sign In
      </button>
      <p class="admin-login-error" id="login-error"></p>
      <p style="margin-top:var(--space-4);text-align:center;font-size:.85rem;">
        <a href="#" id="show-request-access" style="color:var(--color-accent);">Request access</a>
      </p>
    </form>

    <!-- First-login: set password panel -->
    <form class="admin-login-card" id="setpass-form" data-panel="setpass" hidden>
      <img src="/assets/images/logo.png" alt="Studio 37" />
      <h1>Create your password</h1>
      <p style="color:var(--color-text-muted);font-size:.9rem;text-align:center;margin:0 0 var(--space-4);">
        Welcome, <strong id="setpass-email"></strong>. Choose a password to finish setting up your account.
      </p>
      <div class="form-field">
        <label class="form-label" for="setpass1">New password</label>
        <input class="form-input" id="setpass1" type="password" autocomplete="new-password" minlength="8" required />
      </div>
      <div class="form-field">
        <label class="form-label" for="setpass2">Confirm password</label>
        <input class="form-input" id="setpass2" type="password" autocomplete="new-password" minlength="8" required />
      </div>
      <button class="btn-primary" style="width:100%;margin-top:var(--space-4);justify-content:center;" type="submit">
        Save &amp; Sign In
      </button>
      <p class="admin-login-error" id="setpass-error"></p>
    </form>

    <!-- Request-access panel -->
    <form class="admin-login-card" id="request-form" data-panel="request" hidden>
      <img src="/assets/images/logo.png" alt="Studio 37" />
      <h1>Request access</h1>
      <p style="color:var(--color-text-muted);font-size:.9rem;text-align:center;margin:0 0 var(--space-4);">
        Drew will be notified and can approve your account.
      </p>
      <div class="form-field">
        <label class="form-label" for="reqEmail">Email</label>
        <input class="form-input" id="reqEmail" type="email" autocomplete="email" required />
      </div>
      <div class="form-field">
        <label class="form-label" for="reqName">Your name (optional)</label>
        <input class="form-input" id="reqName" type="text" />
      </div>
      <div class="form-field">
        <label class="form-label" for="reqMessage">Message (optional)</label>
        <textarea class="form-textarea" id="reqMessage" rows="3"></textarea>
      </div>
      <button class="btn-primary" style="width:100%;margin-top:var(--space-4);justify-content:center;" type="submit">
        Submit request
      </button>
      <p class="admin-login-error" id="request-error"></p>
      <p class="admin-login-success" id="request-success" hidden></p>
      <p style="margin-top:var(--space-4);text-align:center;font-size:.85rem;">
        <a href="#" id="show-signin" style="color:var(--color-accent);">Back to sign in</a>
      </p>
    </form>
  </section>

</body>
</html>
