<!doctype html>
<html lang="en" data-page="admin">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Studio 37 Admin</title>
  <link rel="icon" href="/assets/images/logo.png" />
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
  <script defer src="/assets/js/admin.js"></script>
</head>
<body class="admin grain">

  <!-- ── LOGIN VIEW ─────────────────────────────────────── -->
  <section class="admin-login" id="view-login">
    <form class="admin-login-card" id="login-form">
      <img src="/assets/images/logo.png" alt="Studio 37" />
      <h1>Studio 37 Admin</h1>
      <div class="form-field">
        <label class="form-label" for="adminKey">Password</label>
        <input class="form-input" id="adminKey" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn-primary" style="width:100%;margin-top:var(--space-4);justify-content:center;" type="submit">
        Enter Admin
      </button>
      <p class="admin-login-error" id="login-error"></p>
    </form>
  </section>

  <!-- ── DASHBOARD VIEW ─────────────────────────────────── -->
  <section class="admin-layout" id="view-dashboard" hidden>
    <aside class="admin-sidebar">
      <div class="admin-sidebar-logo">
        <img src="/assets/images/logo.png" alt="Studio 37" />
        <span class="label">Admin</span>
      </div>
      <ul class="admin-nav">
        <li><a href="#products" class="active" data-section="products">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><polyline points="3.3 7 12 12 20.7 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>
          Products
        </a></li>
        <li><a href="#orders" data-section="orders">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Orders
        </a></li>
        <li><a href="#leads" data-section="leads">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16v12H5.2L2 19V4Z"/></svg>
          Leads
        </a></li>
      </ul>
      <div class="admin-sidebar-foot">
        <a href="/" target="_blank" rel="noopener">View Site &rarr;</a>
        <br/><br/>
        <a href="#" id="logout">Sign out</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <h2 id="section-title">Products</h2>
        <div class="admin-topbar-actions">
          <button class="btn-admin" id="new-product-btn">+ New Product</button>
        </div>
      </header>
      <div class="admin-content">
        <!-- PRODUCTS SECTION -->
        <section id="section-products">
          <div class="admin-toolbar">
            <input type="search" id="search" placeholder="Search products&hellip;" />
            <select id="status-filter">
              <option value="all">All statuses</option>
              <option value="available">Available</option>
              <option value="out_of_stock">Out of Stock</option>
              <option value="by_request">By Request</option>
              <option value="archived">Archived</option>
            </select>
            <select id="category-filter">
              <option value="all">All categories</option>
              <option value="small-goods">Small Goods</option>
              <option value="furniture">Furniture</option>
              <option value="cabinetry">Cabinetry</option>
              <option value="slab-work">Slab Work</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <table class="admin-table">
            <thead>
              <tr>
                <th style="width:80px;"></th>
                <th>Product</th>
                <th style="width:120px;">Price</th>
                <th style="width:160px;">Status</th>
                <th style="width:120px;text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="products-tbody">
              <tr><td colspan="5" style="padding:var(--space-7);text-align:center;color:var(--color-text-muted);">Loading&hellip;</td></tr>
            </tbody>
          </table>
        </section>

        <!-- ORDERS SECTION (placeholder — link to Snipcart dashboard) -->
        <section id="section-orders" hidden>
          <p style="color:var(--color-text-muted);">
            Orders are managed in the Snipcart dashboard.
            <a href="https://app.snipcart.com" target="_blank" rel="noopener" style="color:var(--color-accent);">Open Snipcart &rarr;</a>
          </p>
        </section>

        <!-- LEADS SECTION -->
        <section id="section-leads" hidden>
          <table class="admin-table">
            <thead>
              <tr><th>When</th><th>Name</th><th>Service</th><th>Phone</th><th>Email</th></tr>
            </thead>
            <tbody id="leads-tbody">
              <tr><td colspan="5" style="padding:var(--space-7);text-align:center;color:var(--color-text-muted);">Loading&hellip;</td></tr>
            </tbody>
          </table>
        </section>
      </div>
    </main>
  </section>

  <!-- ── EDIT DRAWER ────────────────────────────────────── -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <header class="drawer-head">
      <h3 id="drawer-title">Edit Product</h3>
      <button class="btn-admin-ghost" id="drawer-close" aria-label="Close">&times;</button>
    </header>
    <form class="drawer-body" id="product-form">
      <input type="hidden" name="id" id="f-id" />

      <div class="form-field">
        <label class="form-label" for="f-name">Name</label>
        <input class="form-input" id="f-name" name="name" required />
      </div>
      <div class="form-field">
        <label class="form-label" for="f-subtitle">Subtitle / wood species</label>
        <input class="form-input" id="f-subtitle" name="subtitle" />
      </div>
      <div class="form-row">
        <div class="form-field">
          <label class="form-label" for="f-category">Category</label>
          <select class="form-select" id="f-category" name="category">
            <option value="small-goods">Small Goods</option>
            <option value="furniture">Furniture</option>
            <option value="cabinetry">Cabinetry</option>
            <option value="slab-work">Slab Work</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="form-field">
          <label class="form-label" for="f-price">Price (USD)</label>
          <input class="form-input" id="f-price" name="price" type="number" step="0.01" min="0" />
        </div>
      </div>

      <div class="form-field">
        <span class="form-label">Status</span>
        <div class="pill-group">
          <label class="pill-radio"><input type="radio" name="status" value="available" checked /><span>Available</span></label>
          <label class="pill-radio"><input type="radio" name="status" value="out_of_stock" /><span>Out of Stock</span></label>
          <label class="pill-radio"><input type="radio" name="status" value="by_request" /><span>By Request</span></label>
          <label class="pill-radio"><input type="radio" name="status" value="archived" /><span>Archive</span></label>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label" for="f-description">Description</label>
        <textarea class="form-textarea" id="f-description" name="description"></textarea>
      </div>

      <div class="form-field">
        <span class="form-label">Photos</span>
        <label class="upload-zone" id="f-upload-zone">
          <input type="file" id="f-photos" accept="image/*" multiple style="display:none;" />
          <span>Click to upload (up to 5)</span>
        </label>
        <div class="image-thumbs" id="f-thumbs"></div>
      </div>

      <div class="form-field">
        <label class="form-label">
          <input type="checkbox" id="f-shipping" name="shipping" checked /> Ships to USA
        </label>
      </div>

      <div class="form-field">
        <label class="form-label" for="f-weight">Weight (oz, for shipping)</label>
        <input class="form-input" id="f-weight" name="weight_oz" type="number" min="0" />
      </div>
    </form>
    <footer class="drawer-foot">
      <button class="btn-admin-ghost" type="button" id="drawer-cancel">Cancel</button>
      <button class="btn-admin" type="submit" form="product-form">Save Product</button>
    </footer>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
