# Studio 37 — Netlify configuration

[build]
  publish = "src"
  functions = "src/netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Default Node.js runtime — overridable per-function if needed.

# Pretty URLs: /services -> /services.html (Netlify does this automatically with `pretty_urls`).
[build.processing.html]
  pretty_urls = true

# API routing: /api/* lives in functions
[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/products"
  status = 200

[[redirects]]
  from = "/api/products/:id"
  to = "/.netlify/functions/products?id=:id"
  status = 200

[[redirects]]
  from = "/api/admin/products"
  to = "/.netlify/functions/admin-products"
  status = 200

[[redirects]]
  from = "/api/admin/products/:id"
  to = "/.netlify/functions/admin-products?id=:id"
  status = 200

[[redirects]]
  from = "/api/admin/upload"
  to = "/.netlify/functions/admin-upload"
  status = 200

[[redirects]]
  from = "/api/quote-request"
  to = "/.netlify/functions/quote-request"
  status = 200

[[redirects]]
  from = "/api/order-notify"
  to = "/.netlify/functions/order-notify"
  status = 200

[[redirects]]
  from = "/api/seed-products"
  to = "/.netlify/functions/seed-products"
  status = 200

[[redirects]]
  from = "/api/public-config"
  to = "/.netlify/functions/public-config"
  status = 200

[[redirects]]
  from = "/api/admin/leads"
  to = "/.netlify/functions/admin-leads"
  status = 200

[[redirects]]
  from = "/api/reviews"
  to = "/.netlify/functions/reviews"
  status = 200

[[redirects]]
  from = "/api/admin/reviews"
  to = "/.netlify/functions/admin-reviews"
  status = 200

[[redirects]]
  from = "/api/admin/reviews/:id"
  to = "/.netlify/functions/admin-reviews?id=:id"
  status = 200

# Auth
[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/set-password"
  to = "/.netlify/functions/auth-set-password"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200

[[redirects]]
  from = "/api/auth/request-access"
  to = "/.netlify/functions/auth-request-access"
  status = 200

# Admin user management
[[redirects]]
  from = "/api/admin/users"
  to = "/.netlify/functions/admin-users"
  status = 200

[[redirects]]
  from = "/api/admin/users/:email"
  to = "/.netlify/functions/admin-users?email=:email"
  status = 200

[[redirects]]
  from = "/api/admin/users/:email/:action"
  to = "/.netlify/functions/admin-users?email=:email&action=:action"
  status = 200

# SPA-style fallback for /admin (single-page admin app)
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
